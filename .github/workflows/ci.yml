name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Task names without a variant, so a module that is not an Android
      # module still gets run. `testDebugUnitTest` would quietly skip :domain.
      - name: Formatting
        run: ./gradlew ktlintCheck

      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lint

      # Last, because it is the slowest and the least likely to be the thing
      # that broke: a compile error would already have failed the tests.
      - name: Assemble
        run: ./gradlew assembleDebug

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: |
            */build/reports/tests/
            */build/reports/ktlint/
          retention-days: 7
